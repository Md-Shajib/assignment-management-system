# ============================================
# Assignment Management System - Docker Compose
# Usage:
#   1. cp .env.example .env   (set real secrets)
#   2. docker compose up --build
#
# Services: PostgreSQL 16, ASP.NET Core API, Next.js frontend.
# ============================================

name: assignment-management-system

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_db}
      POSTGRES_USER: ${POSTGRES_USER:-assignment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assignment_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assignment_user} -d ${POSTGRES_DB:-assignment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      DB_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB:-assignment_db};Username=${POSTGRES_USER:-assignment_user};Password=${POSTGRES_PASSWORD:-assignment_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-AssignmentSystem}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AssignmentSystemUsers}
      JWT_EXPIRATION_IN_MINUTES: ${JWT_EXPIRATION_IN_MINUTES:-120}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@school.com}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data: